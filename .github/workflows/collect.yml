name: 在线采集北京/南京空气质量与气象数据
# 说明：
#   数据源（全部为官方/公开数据源，页面数据源列有如实标注）：
#     · AQI 日报：中国环境监测总站城市日报（air.cnemc.cn，官方，近14天）
#     · AQI 正点（02/08/14/20时）：中国环境监测总站城市小时值（官方）
#     · 气象日报：中国天气网历史日历（CMA 官方）+ Open-Meteo（UV 模型值、旧日降水/天气/风况 ERA5 补位）
#     · 气象正点：中国天气网实况（CMA 官方）+ Open-Meteo 小时模型值（紫外线及缺失时次回填）
#   调度（UTC）：每 3 小时的 :10 运行一次，对应北京时间 08:10/11:10/14:10/17:10/20:10/23:10/02:10/05:10，
#   其中 02/08/14/20 整点后的一次为正点采样，其余为回填兜底（睡眠/延迟丢失的时次由 24h 窗口或模型值补齐）。

on:
  schedule:
    - cron: "10 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install certifi
      - name: 采集数据并渲染看板
        env:
          TZ: Asia/Shanghai
        run: |
          python3 collect_aqi.py --nowait        # AQI 日报（官方城市日报，只补缺不覆盖）
          python3 weather_collect.py --nowait    # 气象日报+四正点采样+回填兜底+正点AQI采样回填
          python3 render_dashboard.py            # CSV -> data.js
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "本轮无数据变化，跳过提交"
          else
            git commit -m "auto: 数据更新 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
            git push
          fi
